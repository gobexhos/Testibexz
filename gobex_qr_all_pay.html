<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a39">
<title>QR All Pay — GOBEX STORE</title>
<style>
:root{--navy:#06152f;--blue:#147bff;--gold:#ffd45b;--ink:#f4f8ff;--muted:#a9bbd5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 14px 105px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 0%,#174b8b 0,transparent 40%),radial-gradient(ellipse at 95% 45%,#29385f 0,transparent 38%),linear-gradient(145deg,#030b1c,#081d3c 58%,#071329)}
.wrap{width:min(100%,700px);margin:auto}
.profile{display:flex;align-items:center;gap:14px;width:fit-content;max-width:100%;padding:13px 17px;border:1px solid #7eb8ff35;border-radius:20px;background:linear-gradient(130deg,#123f75dd,#081a36ee);box-shadow:0 12px 35px #0005}
.avatar{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#ffecad,#e5a91e);color:#09234b;font-size:22px;font-weight:1000;letter-spacing:-1px}
.name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-size:clamp(19px,5vw,25px);font-weight:900;letter-spacing:.2px}
.check{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#168bff;color:white;font-size:13px;font-weight:1000;box-shadow:0 0 13px #168bff66}
.caption{margin-top:5px;color:#b9cce6;font-size:11px}
main{text-align:center}
.heading{margin:32px 0 17px}
.kicker{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:2.4px;text-transform:uppercase}
h1{margin:8px 0 0;font-size:clamp(23px,6vw,34px);font-weight:950;letter-spacing:.3px;line-height:1.15}
h1 span{color:var(--gold)}
.qr-panel{padding:clamp(12px,3vw,22px);border-radius:25px;border:1px solid #ffd45b75;background:linear-gradient(145deg,#fff,#f5f7fb);box-shadow:0 20px 60px #0007,0 0 28px #ffcf4b20}
.qr-image{display:block;width:100%;height:auto;max-height:720px;object-fit:contain;border-radius:8px}
.qr-caption{margin-top:12px;color:#172c4c;font-size:11px;font-weight:750;letter-spacing:.8px}
.benefits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:26px 0 25px}
.benefit{padding:12px 9px;border-radius:13px;border:1px solid #8bbfff2c;background:linear-gradient(120deg,#123c70dd,#0a2041ee);font-size:12px;font-weight:850;letter-spacing:.3px}
.benefit span{color:var(--gold);margin-left:4px}
.support{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;width:min( calc(100% - 28px),420px);padding:15px 20px;border-radius:16px;background:linear-gradient(135deg,#20d17f,#087b50);color:white;text-decoration:none;font-size:14px;font-weight:900;letter-spacing:.6px;border:1px solid #a0ffd2;box-shadow:0 12px 30px #0008}
.support:hover{filter:brightness(1.07)}
.support-icon{width:24px;height:24px;display:grid;place-items:center;border:2px solid #fff;border-radius:8px;font-size:15px}
.footnote{margin-top:17px;color:#90a7c8;font-size:10px;line-height:1.6}
@media(min-width:600px){.benefits{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
